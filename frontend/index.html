<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener("error", function(e) {
        document.body.innerHTML += '<div style="background:#fff;color:red;padding:20px;position:fixed;top:0;left:0;z-index:9999;width:100%;height:100%;overflow:auto"><pre>' + (e.error ? e.error.stack : e.message) + '</pre></div>';
      });
      window.addEventListener("unhandledrejection", function(e) {
        document.body.innerHTML += '<div style="background:#fff;color:red;padding:20px;position:fixed;top:0;left:0;z-index:9999;width:100%;height:100%;overflow:auto"><pre>Unhandled Promise: ' + (e.reason ? (e.reason.stack || e.reason.message || e.reason) : "Unknown") + '</pre></div>';
      });
    </script>
  </body>
</html>
